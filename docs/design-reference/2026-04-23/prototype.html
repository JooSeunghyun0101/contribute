<script type="text/babel" data-presets="env,react">

const { useState, useEffect, useRef, useMemo } = React;
const M = window.OK_MOCK;

// Shared primitives
const Pill = ({ tone = 'neutral', children }) => {
  const map = {
    neutral: { bg: 'var(--n-50)', c: 'var(--fg-muted)', b: 'var(--border)' },
    orange: { bg: 'var(--ok-orange-50)', c: 'var(--ok-orange-700)', b: 'transparent' },
    success: { bg: 'var(--success-bg)', c: 'var(--success)', b: 'transparent' },
    warning: { bg: 'var(--warning-bg)', c: 'var(--warning)', b: 'transparent' },
    danger: { bg: 'var(--danger-bg)', c: 'var(--danger)', b: 'transparent' },
    info: { bg: 'var(--info-bg)', c: 'var(--info)', b: 'transparent' },
    ghost: { bg: 'transparent', c: 'var(--fg-muted)', b: 'var(--border-strong)' }
  }[tone];
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '3px 10px', borderRadius: 999, fontSize: 11, fontWeight: 700, background: map.bg, color: map.c, border: `1px solid ${map.b}` }}>{children}</span>;
};

const SCORE_COLORS = { 4: 'var(--ok-orange)', 3: 'var(--ok-orange-600)', 2: 'var(--ok-yellow)', 1: 'var(--n-300)' };
const ScoreBadge = ({ score }) => {
  if (score == null) return <Pill tone="neutral">미평가</Pill>;
  const col = SCORE_COLORS[score];
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
    <span style={{ width: 28, height: 28, borderRadius: 8, background: col, color: '#fff', fontWeight: 900, fontSize: 15, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} className="tnum">{score}</span>
    <span style={{ fontWeight: 800, fontSize: 14 }} className="tnum">{score}.0</span>
  </span>;
};

// =========================================================
// ROUTER — role-based pages
// =========================================================
const DEFAULT_ROLE = 'evaluatee';
const DEFAULT_PAGE = 'dashboard';

const userFor = (role) => role === 'evaluator' ? M.evaluatorUser : role === 'hr' ? M.hrUser : M.currentUser;

// =========================================================

const EvaluateeDashboard = () =>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 8 }}>

            const startM = parseInt(t.start.slice(5, 7)) - 1;
            const endM = parseInt(t.end.slice(5, 7)) - 1;
            const startPct = (startM + parseInt(t.start.slice(8, 10)) / 30) / 6 * 100;
            const widthPct = (endM - startM + (parseInt(t.end.slice(8, 10)) - parseInt(t.start.slice(8, 10))) / 30) / 6 * 100;
            const colors = ['var(--ok-orange)', 'var(--ok-yellow)', 'var(--ok-orange-600)', 'var(--ok-brown)'];
            return <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, height: 32 }}>
                <div style={{ flex: 1, position: 'relative', height: 22, background: 'var(--bg-muted)', borderRadius: 6 }}>

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startLoggedIn": true,
  "dark": false,
  "accentDensity": "comfortable"
} /*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [loggedIn, setLoggedIn] = useState(() => {
    try {return localStorage.getItem('ok_loggedIn') === '1' || TWEAK_DEFAULTS.startLoggedIn;} catch {return TWEAK_DEFAULTS.startLoggedIn;}
  });
  const [role, setRole] = useState(() => localStorage.getItem('ok_role') || 'evaluatee');
  const [page, setPage] = useState(() => localStorage.getItem('ok_page') || 'dashboard');
  const [theme, setTheme] = useState(() => localStorage.getItem('ok_theme') || (TWEAK_DEFAULTS.dark ? 'dark' : 'light'));
  const [openDetail, setOpenDetail] = useState(false);
  const [editMode, setEditMode] = useState(false);

  useEffect(() => {localStorage.setItem('ok_role', role);localStorage.setItem('ok_page', page);localStorage.setItem('ok_loggedIn', loggedIn ? '1' : '0');localStorage.setItem('ok_theme', theme);}, [role, page, loggedIn, theme]);

  // Apply theme to document root
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  // Edit mode protocol
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setEditMode(true);else
      if (d.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    try {window.parent.postMessage({ type: '__edit_mode_available' }, '*');} catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  if (!loggedIn) return <Login onLogin={() => setLoggedIn(true)} />;

  const user = userFor(role);
  return <>
    <Shell role={role} setRole={setRole} page={page} setPage={setPage} user={user} openDetail={openDetail} setOpenDetail={setOpenDetail} theme={theme} setTheme={setTheme} />
    {editMode &&
    <div style={{ position: 'fixed', bottom: 20, right: 20, width: 300, background: '#fff', borderRadius: 14, boxShadow: '0 16px 48px rgba(40,28,24,0.2)', border: '1px solid var(--border)', padding: 16, zIndex: 100 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <b style={{ fontSize: 13 }}>Tweaks</b>
          <span style={{ fontSize: 10, color: 'var(--fg-subtle)', fontWeight: 700, letterSpacing: '0.1em' }}>PROTOTYPE</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: 12 }}>
          <div><div className="label-mini">테마</div>
            <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
              {[['light', '라이트'], ['dark', '다크']].map(([t, l]) =>
            <button key={t} onClick={() => setTheme(t)} style={{ flex: 1, padding: '6px 8px', borderRadius: 6, fontSize: 11, fontWeight: 700, background: theme === t ? 'var(--ok-orange)' : 'var(--bg-muted)', color: theme === t ? '#fff' : 'var(--fg)', border: 'none', cursor: 'pointer' }}>{l}</button>)}
            </div>
          </div>
          <div><div className="label-mini">역할 바로 이동</div>
            <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
              {[['evaluatee', '피평가자'], ['evaluator', '평가자'], ['hr', 'HR']].map(([r, l]) =>
            <button key={r} onClick={() => {setRole(r);setPage('dashboard');setOpenDetail(false);}} style={{ flex: 1, padding: '6px 8px', borderRadius: 6, fontSize: 11, fontWeight: 700, background: role === r ? 'var(--ok-orange)' : 'var(--bg-muted)', color: role === r ? '#fff' : 'var(--fg)', border: 'none', cursor: 'pointer' }}>{l}</button>)}
            </div>
          </div>
          <div><div className="label-mini">상태</div>
            <div style={{ display: 'flex', gap: 4, marginTop: 4 }}>
              <button className="btn btn-outline btn-xs" onClick={() => {setLoggedIn(false);}}>로그아웃</button>
              <button className="btn btn-outline btn-xs" onClick={() => {if (role === 'evaluator') setOpenDetail((v) => !v);}}>{openDetail ? '목록으로' : '평가 상세 열기'}</button>
            </div>
          </div>
          <div style={{ paddingTop: 8, borderTop: '1px solid var(--border)', fontSize: 11, color: 'var(--fg-muted)', lineHeight: 1.5 }}>
            상단 역할 스위처 + 좌측 메뉴로도 네비게이션 가능. 벨 아이콘을 누르면 알림 드롭다운이 열립니다.
          </div>
        </div>
      </div>
    }
  </>;
};

Object.assign(window, { Pill, ScoreBadge });
ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
