version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hr-evaluation-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-human-resource}
      POSTGRES_USER: ${POSTGRES_USER:-okholdings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
